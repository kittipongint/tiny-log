<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tiny Log — Monitor</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Tiny Log</div>
    <nav>
      <a href="/">Logs</a>
      <a href="/monitor" class="active">Monitor</a>
      <a href="/swagger">API</a>
      <a href="/clients">Clients</a>
      <a href="/settings">Settings</a>
      <span id="nav-badge" class="nav-badge" hidden></span>
      <span id="nav-user" class="nav-user"></span>
      <button id="logout-btn" type="button" class="linkish">Logout</button>
    </nav>
  </header>

  <main class="monitor">
    <section>
      <div class="section-head">
        <h1>Systems</h1>
        <span id="refresh-hint" class="muted">auto-refresh 30s</span>
      </div>
      <div class="log-table-wrap">
        <table class="log-table systems-table">
          <thead>
            <tr>
              <th>System</th>
              <th>CPU</th>
              <th>Memory</th>
              <th>Disk</th>
              <th>Load</th>
              <th>Recommend</th>
            </tr>
          </thead>
          <tbody id="host-rows"></tbody>
        </table>
      </div>
      <div id="host-detail" class="host-detail" hidden>
        <div class="host-detail-head">
          <h2 id="detail-title"></h2>
          <p id="detail-meta" class="muted"></p>
        </div>
        <div class="spark-grid">
          <figure class="spark-card">
            <figcaption>CPU</figcaption>
            <div id="spark-cpu" class="spark"></div>
          </figure>
          <figure class="spark-card">
            <figcaption>Memory</figcaption>
            <div id="spark-mem" class="spark"></div>
          </figure>
          <figure class="spark-card">
            <figcaption>Disk</figcaption>
            <div id="spark-disk" class="spark"></div>
          </figure>
        </div>
        <p id="detail-forecast" class="muted forecast-line"></p>
      </div>
    </section>

    <section>
      <h2>Services</h2>
      <div class="log-table-wrap">
        <table class="log-table">
          <thead>
            <tr>
              <th>Host</th>
              <th>Service</th>
              <th>Status</th>
              <th>CPU</th>
              <th>Memory</th>
              <th>Load</th>
              <th>Recommend</th>
              <th>Latency</th>
            </tr>
          </thead>
          <tbody id="service-rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/monitor.js"></script>
</body>
</html>
