<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tiny Log</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Tiny Log</div>
    <nav>
      <a href="/" class="active">Logs</a>
      <a href="/monitor">Monitor</a>
      <a href="/swagger">API</a>
      <a href="/clients">Clients</a>
      <a href="/settings">Settings</a>
      <span id="nav-badge" class="nav-badge" hidden></span>
      <span id="nav-user" class="nav-user"></span>
      <button id="logout-btn" type="button" class="linkish">Logout</button>
    </nav>
  </header>

  <section class="filters">
    <label>
      App
      <select id="filter-app">
        <option value="">All</option>
      </select>
    </label>
    <label>
      Level
      <select id="filter-level">
        <option value="">All</option>
        <option value="debug">debug</option>
        <option value="info">info</option>
        <option value="warn">warn</option>
        <option value="error">error</option>
        <option value="fatal">fatal</option>
      </select>
    </label>
    <label class="search-label">
      Search
      <span class="search-row">
        <input id="filter-search" type="search" placeholder="message contains…" />
        <button id="search-btn" type="button">Search</button>
      </span>
    </label>
    <label class="search-label">
      Trace / request id
      <span class="search-row">
        <input id="filter-trace" type="search" placeholder="request_id…" spellcheck="false" />
        <button id="view-traces-btn" type="button" aria-pressed="false" title="One row per request id">Group by trace</button>
      </span>
    </label>
    <button id="live-btn" type="button" class="live-btn" aria-pressed="false">Live</button>
    <label class="export-label">
      Export (current filters)
      <span class="search-row">
        <select id="export-format" aria-label="Export format">
          <option value="csv">CSV</option>
          <option value="ndjson">NDJSON</option>
        </select>
        <button id="export-btn" type="button">Export</button>
      </span>
    </label>
  </section>

  <div id="select-bar" class="select-bar" hidden>
    <span id="select-count"></span>
    <button id="copy-text-btn" type="button">Copy text</button>
    <button id="copy-json-btn" type="button">Copy JSON</button>
    <button id="select-clear-btn" type="button" class="linkish">Clear</button>
  </div>

  <div id="new-logs-banner" class="new-logs" hidden>
    <button type="button" id="new-logs-btn">0 new logs</button>
  </div>

  <main class="log-table-wrap">
    <table class="log-table">
      <thead>
        <tr>
          <th class="pick"><input type="checkbox" id="pick-all" aria-label="Select all shown" /></th>
          <th>Time</th>
          <th>App</th>
          <th>Level</th>
          <th>Message</th>
        </tr>
      </thead>
      <tbody id="log-rows"></tbody>
    </table>
  </main>

  <dialog id="detail-dialog">
    <form method="dialog" class="detail">
      <header>
        <h2>Log detail</h2>
        <button value="close" class="linkish">Close</button>
      </header>
      <div class="copy-row">
        <button type="button" class="linkish" data-copy="message">Copy message</button>
        <button type="button" class="linkish" data-copy="meta">Copy meta</button>
        <button type="button" class="linkish" data-copy="json">Copy JSON</button>
        <button type="button" class="linkish" id="d-trace-btn" hidden>Show whole trace</button>
      </div>
      <dl>
        <dt>Timestamp</dt><dd id="d-timestamp"></dd>
        <dt>App</dt><dd id="d-app"></dd>
        <dt>Level</dt><dd id="d-level"></dd>
        <dt>Source</dt><dd id="d-source"></dd>
        <dt>Message</dt><dd id="d-message" class="pre"></dd>
        <dt>Metadata</dt><dd><pre id="d-meta"></pre></dd>
      </dl>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
