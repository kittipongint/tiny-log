<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tiny Log — Settings</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Tiny Log</div>
    <nav>
      <a href="/">Logs</a>
      <a href="/monitor">Monitor</a>
      <a href="/swagger">API</a>
      <a href="/clients">Clients</a>
      <a href="/settings" class="active">Settings</a>
      <span id="nav-badge" class="nav-badge" hidden></span>
      <span id="nav-user" class="nav-user"></span>
      <button id="logout-btn" type="button" class="linkish">Logout</button>
    </nav>
  </header>

  <main class="settings">
    <h1>Settings</h1>

    <section>
      <h2>Log Retention</h2>
      <label>
        Retention days
        <input id="retention-days" type="number" min="1" max="3650" />
      </label>
      <label>
        Session lifetime (days)
        <input id="session-days" type="number" min="1" />
      </label>
      <label>
        Metrics retention (days)
        <input id="metrics-retention-days" type="number" min="1" max="3650" />
      </label>
      <p id="settings-msg" class="ok" hidden></p>
      <p id="settings-err" class="error" hidden></p>
      <button id="save-settings" type="button">Save</button>
    </section>

    <section>
      <h2>Security</h2>
      <h3>Change Password</h3>
      <label>
        Current password
        <input id="current-password" type="password" autocomplete="current-password" />
      </label>
      <label>
        New password
        <input id="new-password" type="password" autocomplete="new-password" />
      </label>
      <label>
        Confirm password
        <input id="confirm-password" type="password" autocomplete="new-password" />
      </label>
      <p id="password-msg" class="ok" hidden></p>
      <p id="password-err" class="error" hidden></p>
      <button id="change-password" type="button">Change password</button>
    </section>

    <section>
      <h2>Retention</h2>
      <button id="run-retention" type="button" class="danger">Clean up old logs now</button>
      <p id="retention-msg" class="ok" hidden></p>
    </section>
  </main>

  <dialog id="confirm-dialog">
    <form method="dialog" class="confirm">
      <p id="confirm-text"></p>
      <div class="actions">
        <button value="cancel">Cancel</button>
        <button value="confirm" class="danger">Delete</button>
      </div>
    </form>
  </dialog>

  <script src="/settings.js"></script>
</body>
</html>
