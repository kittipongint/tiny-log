[package]
name = "tiny-log-agent"
version = "1.0.3"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "tiny-log-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "net", "fs", "io-util", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hostname = "0.4"
futures = "0.3"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
libc = "0.2"
# [[logs]] include/exclude filters. regex-automata/regex-syntax are already linked via
# tracing-subscriber's env-filter, so this adds little.
regex = { version = "1.11", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
# kind = "mysql_status": no TLS, pure-Rust deflate backend (no zlib C build).
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust"] }
