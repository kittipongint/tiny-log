services:
  tiny-log:
    # Alpine release binary only — compile happens at image build time, not at runtime.
    build:
      context: ./server
      dockerfile: Dockerfile
    image: tiny-log:dev
    ports:
      - "${TINY_LOG_PORT:-8080}:${TINY_LOG_PORT:-8080}"
    environment:
      TINY_LOG_HOST: 0.0.0.0
      TINY_LOG_PORT: ${TINY_LOG_PORT:-8080}
      TINY_LOG_LOGS_DATABASE: /data/logs.db
      TINY_LOG_SYSTEM_DATABASE: /data/system.db
      TINY_LOG_METRICS_DATABASE: /data/metrics.db
      TINY_LOG_WEB_DIR: /app/web
      TINY_LOG_API_KEY: dev-api-key
      TINY_LOG_CLIENT_TOKEN: dev-client-token
      TINY_LOG_AUTH_MODE: ${TINY_LOG_AUTH_MODE:-anonymous}
      TINY_LOG_RETENTION_DAYS: 10
      TINY_LOG_SESSION_DAYS: 7
      TINY_LOG_COOKIE_SECURE: "false"
      RUST_LOG: info
      TOKIO_WORKER_THREADS: "1"
    volumes:
      # Named volume avoids SQLite WAL corruption on Docker Desktop bind mounts (macOS).
      - tiny-log-dev-data:/data
      - ./server/web:/app/web:ro
    mem_limit: 64m
    cpus: 0.50
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "-",
          "http://127.0.0.1:${TINY_LOG_PORT:-8080}/ready"
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tiny-log-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    image: tiny-log-agent:dev
    user: "0:0"
    environment:
      TINY_LOG_URL: http://tiny-log:8080
      TINY_LOG_API_KEY: dev-api-key
      TINY_LOG_HOST_NAME: dev-host
      TINY_LOG_SYSTEM_INTERVAL_SECS: 60
      TINY_LOG_SERVICE_INTERVAL_SECS: 120
      TINY_LOG_DOCKER: "true"
      TINY_LOG_DOCKER_SOCK: /var/run/docker.sock
      RUST_LOG: warn
      TOKIO_WORKER_THREADS: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 32m
    cpus: 0.15
    restart: unless-stopped
    depends_on:
      tiny-log:
        condition: service_healthy

volumes:
  tiny-log-dev-data:
