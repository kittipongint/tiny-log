services:
  tiny-log:
    image: tiny-log:latest
    container_name: tiny-log
    restart: unless-stopped
    ports:
      - "${TINY_LOG_PORT:-8080}:${TINY_LOG_PORT:-8080}"
    environment:
      TINY_LOG_HOST: 0.0.0.0
      TINY_LOG_PORT: ${TINY_LOG_PORT:-8080}
      TINY_LOG_LOGS_DATABASE: /data/logs.db
      TINY_LOG_SYSTEM_DATABASE: /data/system.db
      TINY_LOG_METRICS_DATABASE: /data/metrics.db
      TINY_LOG_WEB_DIR: /app/web
      TINY_LOG_API_KEY: ${TINY_LOG_API_KEY:?set TINY_LOG_API_KEY}
      TINY_LOG_CLIENT_TOKEN: ${TINY_LOG_CLIENT_TOKEN:?set TINY_LOG_CLIENT_TOKEN}
      TINY_LOG_AUTH_MODE: ${TINY_LOG_AUTH_MODE:-login}
      TINY_LOG_RETENTION_DAYS: ${TINY_LOG_RETENTION_DAYS:-10}
      TINY_LOG_SESSION_DAYS: ${TINY_LOG_SESSION_DAYS:-7}
      TINY_LOG_COOKIE_SECURE: ${TINY_LOG_COOKIE_SECURE:-true}
      RUST_LOG: ${RUST_LOG:-info}
      TOKIO_WORKER_THREADS: "1"
    volumes:
      - tiny-log-data:/data
    mem_limit: 64m
    cpus: 0.50
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "-",
          "http://127.0.0.1:${TINY_LOG_PORT:-8080}/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tiny-log-data:
